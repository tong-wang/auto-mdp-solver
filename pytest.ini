# Repo-root pytest config, so a bare `pytest` runs the whole suite.
#
# Two kinds of test live in this repo and both are collected here:
#   harness/tests/            engine tests on synthetic IRs (no example fixtures)
#   plugin/.../examples/*/    each domain's own {domain}_test.py, beside its code
#   cases/*/                  the same, for auto-solved cases
#
# Domain tests rely on pytest's default `prepend` import mode putting each
# test file's own directory on sys.path — that is what makes `import
# {domain}_uncertainty` work from inside a domain folder with no conftest.
# It also means two domain folders must never contain same-named modules;
# the spec's `{domain}_*` file-naming rule is what keeps that true.
[pytest]
testpaths =
    harness/tests
    plugin/skills/mdp-solver/examples
    cases
python_files = test_*.py *_test.py
addopts = -q --strict-markers
