[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mdp-solver"
version = "0.1.0"
description = "MDP solver pipeline: IR schema + interpreter, conformance harness, eval gates, and Optuna tuning driver for spec-conformant RL domains."
requires-python = ">=3.12"
dependencies = [
    "numpy==2.2.5",
    "pydantic>=2",
    "gymnasium==1.1.1",
    "sb3_contrib==2.6.0",
    "optuna==4.9.0",
]

[tool.setuptools]
packages = ["mdp_ir", "mdp_conformance", "mdp_gates", "mdp_tuning"]
