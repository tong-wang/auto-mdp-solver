[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "auto-mdp-solver"
version = "0.11.8"
description = "MDP solver pipeline: IR schema + interpreter, conformance harness, eval gates, and Optuna tuning driver for building trained RL policies from formalized decision problems."
readme = "README.md"
license = "MIT"
authors = [{ name = "Tong Wang" }]
requires-python = ">=3.12"
# Core = what the shipped harness packages (mdp_ir, mdp_conformance, mdp_gates,
# mdp_tuning) actually import. Deliberately torch-free: formalizing an IR,
# checking conformance, or running an eval gate must not pull a ~2 GB stack.
dependencies = [
    "numpy>=2.1,<3",
    "pydantic>=2,<3",
    "gymnasium>=1.1,<1.2",
    "optuna>=4.6,<5",
]

# Domain runtime = what the *generated* domain scripts import (spec §8/§9):
# training, eval, benchmarks, and the deployable policy wrapper. Install with
#   pip install "auto-mdp-solver[domain]"
# `stable-baselines3[extra]` supplies torch + tensorboard; `sb3_contrib`
# supplies MaskablePPO, required by spec §7.1 for action-masked domains;
# `plotly` draws the interactive render spec §14.3 requires of every readback.
# This is the SHARED base; a domain needing more (e.g. SciPy) declares it in
# its own folder's requirements.txt (spec §1.2) — never here. Changing this
# list changes `mdp_conformance.checks.DOMAIN_IMPORTS`; a test keeps them in step.
[project.optional-dependencies]
domain = [
    "stable-baselines3[extra]>=2.6,<3",
    "sb3_contrib>=2.6,<3",
    "pandas>=2.2,<3",
    "plotly>=5.20,<8",
    # a generated domain ships its own `{domain}_test.py` (spec §1.2), so the
    # extra that makes a domain runnable must also make its gates runnable —
    # `[domain]` alone is enough to build a case AND check it. Self-reference
    # rather than a second pin, so the version lives in one place.
    "auto-mdp-solver[dev]",
]

# Test runtime on its own — the torch-free path. `pytest harness/tests` and a
# domain's `{domain}_test.py` both run under this alone (neither imports the
# training stack), so harness work never pulls a ~2 GB dependency.
dev = [
    "pytest>=8,<10",
]

[project.urls]
Repository = "https://github.com/tong-wang/auto-mdp-solver"
Issues = "https://github.com/tong-wang/auto-mdp-solver/issues"

[tool.setuptools]
packages = ["mdp_ir", "mdp_conformance", "mdp_gates", "mdp_tuning", "mdp_stage"]
