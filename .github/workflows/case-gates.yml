name: case-gates

# Runs the executable gates on every case directory touched by a PR:
#   1. IR schema validation      (python -m mdp_ir <schema>)
#   2. spec conformance          (python -m mdp_conformance <case-dir>)
#   3. differential IR-vs-domain (python -m mdp_ir.differential <schema>)
# This is what makes case-contribution review mechanical (AGENT_PLAN §4,
# mdp-contribute tier 1): a green run means the case honors the portable-domain
# contract and its simulator matches its frozen IR bit-exactly.

on:
  pull_request:
    paths:
      - "cases/**"

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install harness (torch-free bare install)
        run: python -m pip install -e ./harness

      - name: Run gates on changed case dirs
        run: |
          set -euo pipefail
          base="origin/${{ github.base_ref }}"
          mapfile -t dirs < <(git diff --name-only "$base"...HEAD -- cases/ \
            | cut -d/ -f1-2 | sort -u)
          ran=0
          for d in "${dirs[@]}"; do
            [ -d "$d" ] || continue            # skip cases/README.md etc.
            schema=$(find "$d" -maxdepth 1 -name "*_schema.json" | head -1)
            if [ -z "$schema" ]; then
              echo "::error::$d has no *_schema.json — not a valid case dir"
              exit 1
            fi
            echo "=== $d ==="
            python -m mdp_ir "$schema"
            python -m mdp_conformance "$d"
            python -m mdp_ir.differential "$schema" --episodes 40
            ran=1
          done
          if [ "$ran" -eq 0 ]; then
            echo "No case directories changed — nothing to gate."
          fi
