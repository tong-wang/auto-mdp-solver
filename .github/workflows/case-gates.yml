name: case-gates

# Runs the executable gates on every domain directory touched by a PR:
#   1. IR schema validation      (python -m mdp_ir <schema>)
#   2. spec conformance          (python -m mdp_conformance <dir>)
#   3. IR execution semantics    (python -m mdp_ir.laws <dir>)
#   4. differential IR-vs-domain (python -m mdp_ir.differential <schema>)
#   5. the domain's own tests    (pytest <dir>)
# This is what makes case-contribution review mechanical (AGENT_PLAN §4,
# mdp-contribute tier 1): a green run means the case honors the portable-domain
# contract and its simulator matches its frozen IR bit-exactly.
#
# Two roots are gated, because a domain can be admitted to either and a
# promotion moves a folder from the first to the second:
#   cases/<name>/                              auto-solve test cases
#   plugin/skills/mdp-solver/examples/<name>/  the frozen regression suite
# Gating only `cases/` would mean a promoted folder — the one that ships with
# the plugin — is the one nothing runs on. The two roots sit at different
# depths, which is all the `cut` fields below are doing.

on:
  pull_request:
    paths:
      - "cases/**"
      - "plugin/skills/mdp-solver/examples/**"

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install harness (torch-free, plus the pytest test extra)
        run: python -m pip install -e "./harness[dev]"

      - name: Run gates on changed domain dirs
        run: |
          set -euo pipefail
          base="origin/${{ github.base_ref }}"
          examples="plugin/skills/mdp-solver/examples"
          mapfile -t dirs < <(
            {
              git diff --name-only "$base"...HEAD -- cases/     | cut -d/ -f1-2
              git diff --name-only "$base"...HEAD -- "$examples/" | cut -d/ -f1-5
            } | sort -u)
          ran=0
          for d in "${dirs[@]}"; do
            # skips cases/README.md, examples/MANIFEST.md and any deleted dir
            # (a promotion's source side shows up here and no longer exists)
            [ -d "$d" ] || continue
            # one catalog schema per domain (IR_LAYERING_PLAN §10): validation
            # resolves base + every instance; the differential sweeps the
            # declared covering set with --all-instances. A legacy resolved
            # single-file schema gates identically (no instances beyond its own).
            mapfile -t schemas < <(find "$d" -maxdepth 1 -name "*_schema.json" | sort)
            if [ ${#schemas[@]} -eq 0 ]; then
              echo "::error::$d has no *_schema.json — not a valid domain dir"
              exit 1
            fi
            echo "=== $d ==="
            python -m mdp_conformance "$d"
            python -m mdp_ir.laws "$d"
            for s in "${schemas[@]}"; do
              echo "--- schema: $(basename "$s") ---"
              python -m mdp_ir "$s"
              python -m mdp_ir.differential "$s" --all-instances --episodes 40
            done
            # the domain's own {name}_test.py (spec §1.2): the covering-set
            # differential parametrized per composition, plus its domain claims
            if compgen -G "$d/*_test.py" > /dev/null; then
              pytest "$d"
            else
              echo "::error::$d has no {name}_test.py — required by spec §1.2"
              exit 1
            fi
            ran=1
          done
          if [ "$ran" -eq 0 ]; then
            echo "No domain directories changed — nothing to gate."
          fi
